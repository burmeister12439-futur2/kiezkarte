const SALZ_C = "kiezkarte-code-2026", SALZ_L = "kiezkarte-loesung-2026";
const roh = s => new TextEncoder().encode(s);
function streu(s){ let h = 2166136261; for (const b of roh(s)){ h ^= b; h = Math.imul(h,16777619) >>> 0; } return h >>> 0; }
function strom(saat,n){ let s = saat >>> 0; const a = new Uint8Array(n);
  for (let i=0;i<n;i++){ s = (Math.imul(s,1664525) + 1013904223) >>> 0; a[i] = (s >>> 24) & 0xFF; } return a; }
function oeffne(b64,saat){ const bin = atob(b64), a = new Uint8Array(bin.length);

  const k = strom(saat,a.length); for (let i=0;i<a.length;i++) a[i] ^= k[i];
  return new TextDecoder().decode(a); }
/* Namen auf das Wesentliche bringen, damit Gross- und Kleinschreibung,

function knapp(n){ return (n||"").toLowerCase()
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
  .replace(/[^a-z0-9]/g,""); }
const Z = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const b36 = (n,st) => { let s = ""; n = Math.max(0,Math.floor(n));
  for (let i=0;i<st;i++){ s = Z[n % 36] + s; n = Math.floor(n/36); } return s; };

function codeBauen(name, punkte, sekunden, endeMin){
  const kern = b36(punkte,1) + b36(Math.min(1295,Math.round(sekunden/5)),2)
             + b36(Math.min(1295,Math.max(0,endeMin-900)),2);
  return kern + b36(streu(SALZ_C + knapp(name) + "|" + kern) % 1296, 2);

  if (b36(streu(SALZ_C + knapp(name) + "|" + kern) % 1296, 2) !== c.slice(5)) return null;

/* Der Knopf wird erst zur Freigabe scharf. */
function knopf(){
  const platz = e('knopfplatz');
  if (!platz) { clearInterval(warten); warten = null; return; }

    platz.innerHTML = '<button class="knopf" onclick="los()">Los geht\'s</button>';

function los(){

  clearInterval(ticker);
  ticker = setInterval(() => { const u = e('uhr'); if (u) u.textContent = mmss((Date.now()-start)/1000); }, 500);

function waehle(k){
  if (beantwortet) return;
  beantwortet = true;
  const q = F[i], r = loesung(q);

}
